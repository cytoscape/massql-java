# The SDK and the CLI are versioned INDEPENDENTLY and released separately.
#
# A change to the CLI wrapper should not force a new SDK coordinate for consumers to
# resolve, and an SDK release should not imply the CLI changed. Override either on the
# command line -- `make set-version-sdk V=1.2.3` / `make set-version-cli V=1.2.3` -- or
# directly with -PsdkVersion= / -PcliVersion=.
sdkVersion=0.0.1-SNAPSHOT
cliVersion=0.0.1-SNAPSHOT

# The configuration cache is off because the dependency audit
# and the coverage gate read resolved artifacts and test results at execution time.
org.gradle.configuration-cache=false
