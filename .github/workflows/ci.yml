# Runs the build's test targets on every push to main and every PR.
#
# The Windows leg is not redundant: mzML/mzXML reading memory-maps the input, and only Windows
# refuses to delete a file whose mapping is still live. ResourceLeakIT.mappedFileIsUnlockedOnceClosed
# is the assertion that catches a regression there, and it can only fail on this leg.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # The runner image does not ship GNU make, and the Makefile is the only supported entry point.
      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Unit tests
        run: make test

      - name: Full suite
        run: make integration-test

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/test-results/
            build/reports/
            cli/build/test-results/
            cli/build/reports/
          retention-days: 7
