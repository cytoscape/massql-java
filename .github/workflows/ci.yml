# Runs the full test suite on every push to master and every PR.
#
# Modelled on ../cy-ndex-2/.github/workflows/ci.yml, with four deliberate differences:
#
#   0. Every step calls `make`, never `mvn`. The Makefile is the only entry point, so what CI
#      runs and what a developer runs cannot drift — and a guard like the zero-skip assertion
#      lives in a target that is runnable locally rather than only here.
#   1. `make verify` wraps `mvn verify`, NOT `mvn test`. cy-ndex-2 runs `mvn test`, which
#      invokes surefire only. All three of this spike's gates live in *IT.java files run by
#      failsafe (reader parity, the differential, the CLI contract), so a test-only run would
#      report green while skipping every gate.
#   2. JDK 17, not 11 — DEPENDENCY_POLICY.md constraint 7 (matches Cytoscape 3.10.4).
#   3. No `xvfb-run`. cy-ndex-2 needs a virtual display because Cytoscape touches AWT;
#      nothing in massql-java does (SPIKE.md §6d: "No display needed").
name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # The two Ewing-lab fixtures are the only test data not committed: ewinglab.org states no
      # redistribution terms (Correction C26). Everything else lives in src/test/resources.
      # Cached so the flaky upstream is contacted once rather than on every run -- SPIKE.md §9
      # warns that flaky CI destroys the credibility of a conformance number.
      - name: Cache the fetched Ewing fixtures
        uses: actions/cache@v4
        with:
          path: |
            src/test/resources/data/DP00570_F02.mzxml
            src/test/resources/data/DP00570_F02.mgf
          key: ewing-fixtures-3761778-2196881   # sizes are the identity; a changed upstream = a new key

      # Required, not best-effort: Ms1ScanDocumentOrderIT is the only test that can distinguish
      # document-order ms1scan from precursorScanNum resolution, and under C26 it FAILS rather than
      # skipping when the fixture is absent. Letting this step pass on error would only move the
      # failure later and make it look like a reader bug.
      - name: Fetch uncommitted fixtures
        run: make fixtures

      # Unit + integration tests, JaCoCo, the enforcer dependency bans (which run at the
      # validate phase, so a banned dependency fails the build rather than the bundle), then
      # `skipcheck` and `audit`.
      #
      # `make verify` rather than `mvn -B verify`: the Makefile is the ONLY entry point, so what
      # CI runs and what a developer runs cannot drift. The zero-skip assertion used to be
      # duplicated inline here -- it now lives in `make skipcheck`, which means it is also
      # runnable locally, which is the only way a guard like that actually gets used.
      #
      # What skipcheck guards (Correction C26): fixtures once lived outside the repo and
      # Fixtures.require() used assumeTrue, so every parity assertion SKIPPED while the counter --
      # which includes skips in "Tests run" -- stayed healthy. CI was green for four steps while
      # proving only that the code compiled. It now asserts a floor AND zero skips.
      - name: Verify
        run: make verify

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
