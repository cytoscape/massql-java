# Runs the full test suite on every push to master and every PR.
#
# Modelled on ../cy-ndex-2/.github/workflows/ci.yml, with three deliberate differences:
#
#   1. `mvn verify`, NOT `mvn test`. cy-ndex-2 runs `mvn test`, which invokes surefire
#      only. All three of this spike's gates live in *IT.java files run by failsafe
#      (reader parity, the differential, the CLI contract), so `mvn test` would report
#      green while skipping every gate.
#   2. JDK 17, not 11 — DEPENDENCY_POLICY.md constraint 7 (matches Cytoscape 3.10.4).
#   3. No `xvfb-run`. cy-ndex-2 needs a virtual display because Cytoscape touches AWT;
#      nothing in massql-java does (SPIKE.md §6d: "No display needed").
name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # The two Ewing-lab fixtures are the only test data not committed: ewinglab.org states no
      # redistribution terms (Correction C26). Everything else lives in src/test/resources.
      # Cached so the flaky upstream is contacted once rather than on every run -- SPIKE.md §9
      # warns that flaky CI destroys the credibility of a conformance number.
      - name: Cache the fetched Ewing fixtures
        uses: actions/cache@v4
        with:
          path: |
            src/test/resources/data/DP00570_F02.mzxml
            src/test/resources/data/DP00570_F02.mgf
          key: ewing-fixtures-3761778-2196881   # sizes are the identity; a changed upstream = a new key

      # Required, not best-effort: Ms1ScanDocumentOrderIT is the only test that can distinguish
      # document-order ms1scan from precursorScanNum resolution, and under C26 it FAILS rather than
      # skipping when the fixture is absent. Letting this step pass on error would only move the
      # failure later and make it look like a reader bug.
      - name: Fetch uncommitted fixtures
        run: bash scripts/fetch-fixtures.sh

      # Unit + integration tests, JaCoCo, and the enforcer dependency bans (which run at
      # the validate phase, so a banned dependency fails the build rather than the bundle).
      - name: Verify
        run: mvn -B verify

      # DEPENDENCY_POLICY.md as an executable check: exits non-zero if the shipping
      # closure exceeds ~1.5 MB or if any artifact carries META-INF/services,
      # META-INF/versions or a native library.
      - name: Dependency audit
        run: bash scripts/dependency-audit.sh

      # Guards against a vacuous green run, from both directions (Correction C26).
      #
      # The original version only checked that SOMETHING ran, and that was not enough: fixtures
      # lived outside the repo and Fixtures.require() used assumeTrue, so every parity assertion
      # SKIPPED while the counter -- which includes skips in "Tests run" -- stayed healthy. CI was
      # green for four steps while proving only that the code compiled.
      #
      # So assert both: a floor on the number executed, AND that nothing was skipped.
      - name: Assert tests actually ran, and none were skipped
        run: |
          set -euo pipefail
          shopt -s nullglob
          total=0 skipped=0
          for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
            line=$(grep -ohE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+' "$f" | head -1 || true)
            [ -z "$line" ] && continue
            n=$(sed -E 's/Tests run: ([0-9]+).*/\1/' <<<"$line")
            s=$(sed -E 's/.*Skipped: ([0-9]+).*/\1/' <<<"$line")
            total=$((total + n)); skipped=$((skipped + s))
          done
          echo "tests executed: $total (skipped: $skipped)"
          if [ "$total" -lt 275 ]; then
            echo "FAIL: only $total tests ran; expected at least 275. Suites are not being" >&2
            echo "      discovered, which is how a green run can prove nothing." >&2
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "FAIL: $skipped test(s) skipped. Under C26 a missing fixture must FAIL, so a skip" >&2
            echo "      means an assumeTrue/@Disabled was reintroduced. Find it and remove it." >&2
            grep -l 'Skipped: [1-9]' target/surefire-reports/*.txt target/failsafe-reports/*.txt || true
            exit 1
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
