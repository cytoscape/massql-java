# Builds a version-stamped artifact, attaches it to the GitHub release, and publishes to the
# NRNB-hosted Nexus repository.
#
# TWO ARTIFACTS, VERSIONED INDEPENDENTLY, so the tag has to say which one it releases:
#
#     sdk-v1.2.3   ->  massql-java 1.2.3        (the thin jar consumers embed)
#     cli-v1.2.3   ->  massql-java-cli 1.2.3    (the standalone uber-jar)
#
# A bare `v1.2.3` tag is REJECTED. It was unambiguous when there was one artifact; now it would
# either publish both at one version -- re-coupling versions that are deliberately independent --
# or silently publish whichever this workflow happened to name.
#
# Modelled on ../cy-ndex-2/.github/workflows/release.yml. Deliberate differences:
#
#   1. JDK 17.
#   2. No `xvfb-run` — nothing here touches AWT.
#   3. Runs the FULL suite instead of skipping tests. cy-ndex-2 skips tests on release; for an SDK
#      whose whole value is bug-for-bug agreement with a pinned MassQL commit, publishing an
#      unverified jar defeats the point.
name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    # ⚠ This is a GitHub *environment* name holding REPO_USER / REPO_PWD, configured in repo
    # settings — not a reference to Maven. Renaming it here would break the secret binding, so it
    # keeps its name; rename the environment in GitHub first if you want it to read `NEXUS`.
    environment: MVN

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # The tag is the single source of truth for BOTH which artifact and which version. Anything
      # that is not `sdk-vX.Y.Z` or `cli-vX.Y.Z` is refused, so a typo cannot publish a bogus
      # coordinate to the nexus.
      - name: Extract and validate artifact and version from tag
        id: rel
        run: |
          TAG="${{ github.event.release.tag_name }}"
          case "$TAG" in
            sdk-v*) ARTIFACT=sdk; VERSION="${TAG#sdk-v}" ;;
            cli-v*) ARTIFACT=cli; VERSION="${TAG#cli-v}" ;;
            *)
              echo "Error: tag '$TAG' does not say which artifact to release."
              echo "Expected sdk-vX.Y.Z (the SDK jar) or cli-vX.Y.Z (the CLI uber-jar)."
              exit 1 ;;
          esac
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "version=$VERSION"   >> $GITHUB_OUTPUT

      - name: Stamp the version
        run: make set-version-${{ steps.rel.outputs.artifact }} V=${{ steps.rel.outputs.version }}

      # Full suite: unit + integration + Spotless + banned deps + the coverage gate, in one target.
      - name: Test
        run: make integration-test

      # Both artifacts, regardless of which one this tag releases: `assemble` depends on shadowJar,
      # so one target covers the SDK jar and the CLI uber-jar. Only the tagged one is uploaded and
      # published below.
      - name: Build the release artifact
        run: make build

      # Attach only the artifact this tag is for. Publishing the other one here would attach a jar
      # whose version was never stamped by this run.
      #
      # ⚠ BUILT and ASSET differ on purpose. Build outputs carry no version (archiveVersion = '' in
      # both build scripts), so the path on disk is fixed -- but a release attachment named
      # massql-java-cli.jar tells a downloader nothing about what they just got. Copy to a versioned
      # name first, and upload that.
      - name: Upload artifact to release
        run: |
          if [ "${{ steps.rel.outputs.artifact }}" = "cli" ]; then
            BUILT="cli/build/libs/massql-java-cli.jar"
            ASSET="massql-java-cli-${{ steps.rel.outputs.version }}.jar"
          else
            BUILT="build/libs/massql-java.jar"
            ASSET="massql-java-${{ steps.rel.outputs.version }}.jar"
          fi
          test -f "$BUILT" || { echo "expected $BUILT to exist"; ls -R build/libs cli/build/libs; exit 1; }
          cp "$BUILT" "$ASSET"
          gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gradle does not read ~/.m2/settings.xml. The repository block in build.gradle /
      # cli/build.gradle prefers ~/.gradle/gradle.properties and falls back to REPO_USER / REPO_PWD,
      # which is what these secrets supply.
      - name: Publish to Nexus
        run: make publish-${{ steps.rel.outputs.artifact }}
        env:
          REPO_USER: ${{ secrets.REPO_USER }}
          REPO_PWD: ${{ secrets.REPO_PWD }}
