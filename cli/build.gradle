// massql-java-cli -- the standalone command-line wrapper, distributed as an uber-jar.
//
// Shadow is applied here and only here: at the root it could make a fat jar the SDK's published
// artifact.

plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.0-rc3'
}

group = 'org.cytoscape'
version = cliVersion          // independent of sdkVersion

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
}

// Build outputs carry no version, as in the SDK. shadowJar is a Jar subtype, so this covers it.
tasks.withType(Jar).configureEach { archiveVersion = '' }

// Named individually, NOT via tasks.withType(Jar): the plain `jar` task also has an empty
// classifier, so it would write to the exact path shadowJar produces and one would overwrite
// the other.
tasks.named('sourcesJar') { archiveBaseName = 'massql-java-cli' }
tasks.named('javadocJar') { archiveBaseName = 'massql-java-cli' }

dependencies {
    implementation project(':')
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The SDK's test RESOURCES only -- not sourceSets.test.output, which would bring its classes.
    testRuntimeOnly files(rootProject.sourceSets.test.output.resourcesDir)

    // The SDK exposes gson as `implementation`, so it reaches the uber-jar at runtime but not the
    // CLI's compile classpath.
    implementation "com.google.code.gson:gson:${rootProject.ext.gsonVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/*IT.class', '**/*IT$*.class'
    systemProperty 'massql.tier', 'test'
    // The resources above are produced by that task, not by simply existing on disk.
    dependsOn rootProject.tasks.named('processTestResources')
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class', '**/*IT$*.class'
    shouldRunAfter tasks.named('test')
    systemProperty 'massql.tier', 'integrationTest'

    dependsOn tasks.named('shadowJar')
    systemProperty 'cliJar',
            tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    dependsOn rootProject.tasks.named('processTestResources')

    // A test cannot detect its own non-execution: a broken filter runs zero tests and exits 0.
    def ran = new java.util.concurrent.atomic.AtomicInteger()
    afterTest { desc, result -> ran.incrementAndGet() }
    doLast {
        if (ran.get() == 0) {
            throw new GradleException(
                    "integrationTest matched no tests -- the *IT.class filter is broken")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// Same coverage bar as the SDK.
jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// The uber-jar IS this project's artifact, hence the empty classifier.
tasks.named('shadowJar') {
    archiveBaseName = 'massql-java-cli'
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'org.cytoscape.massql.cli.Main'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

publishing {
    publications {
        cli(MavenPublication) {
            // Listed explicitly: `from components.java` would publish the thin jar instead.
            artifact tasks.named('shadowJar')
            artifact tasks.named('javadocJar')
            artifact tasks.named('sourcesJar')
            artifactId = 'massql-java-cli'
            pom {
                name = 'massql-java-cli'
                description = 'Standalone MassQL command-line tool (uber-jar).'
                licenses {
                    license {
                        name = 'Eclipse Public License - v 1.0'
                        url = 'https://www.eclipse.org/legal/epl-v10.html'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'nexus'
            def repoId = version.toString().endsWith('SNAPSHOT')
                    ? 'cytoscape_snapshots'
                    : 'cytoscape_releases'
            url = "https://nrnb-nexus.ucsd.edu/repository/${repoId}/"
            credentials {
                username = findProperty("${repoId}User") ?: System.getenv('REPO_USER')
                password = findProperty("${repoId}Pwd") ?: System.getenv('REPO_PWD')
            }
        }
    }
}
