// massql-java -- the SDK. The CLI is a separate, independently versioned project in cli/.
//
// Build/lint conventions follow a sibling project so both behave the same way, taking only what
// applies here: java, spotless, jacoco, maven-publish. Its packaging and extra repositories are
// irrelevant to a plain library.
//
// Code style is NOT documented in prose anywhere. Spotless below is the whole specification:
// `make lint` reports, `make lint-fix` fixes.

plugins {
    id 'java'
    id 'antlr'
    id 'jacoco'
    id 'maven-publish'
    // 8.9.0, not the sibling project's 6.25.0: forbidWildcardImports arrived in 7.1.0 and
    // expandWildcardImports in 8.2.0, and this project relies on both.
    id 'com.diffplug.spotless' version '8.9.0' apply false
    // Dead-code detection at compile time -- see the ErrorProne block below.
    id 'net.ltgt.errorprone' version '5.1.0' apply false
}

group = 'org.cytoscape'
version = sdkVersion          // gradle.properties; independent of cliVersion

ext.antlrVersion = '4.13.2'
ext.junitVersion = '5.11.4'

// Declared once so the SDK and CLI cannot drift apart.
ext.gsonVersion = '2.11.0'

allprojects {
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'net.ltgt.errorprone'

    repositories {
        mavenCentral()
    }

    spotless {
        java {
            // Vendored MSDK code is held byte-identical to upstream by policy (docs/VENDORED.md,
            // asserted by VendoredProvenanceTest). Formatting it would break that guarantee.
            // Vendored MSDK sources are held byte-identical to upstream by policy. NOTE this is
            // src/MAIN only: src/test/.../io/vendor/ holds OUR tests OF the vendored decoder, which
            // are formatted like everything else.
            targetExclude 'src/main/java/org/cytoscape/massql/io/vendor/**',
            // ANTLR's generated lexer/parser. The antlr plugin adds build/generated-src as a java
            // source directory, so Spotless picks it up unless told otherwise -- and it is full of
            // wildcard imports that forbidWildcardImports cannot auto-fix and nobody should hand-fix.
                    'build/generated-src/**'

            // .aosp() = 4-space indent, 100-column limit -- what this codebase already uses.
            //
            // .skipJavadocFormatting() is deliberate: in this project the javadoc IS the
            // specification (reader sentinel contracts, the zero-intensity note, and so on),
            // written with intentional line breaks. Google's javadoc formatter would reflow ~1,965
            // lines of it -- harmless semantically, unreviewable as a diff.
            googleJavaFormat('1.17.0').aosp().skipJavadocFormatting()

            importOrder('java', 'javax', 'org', 'com')
            removeUnusedImports()

            // No wildcard imports, anywhere.
            //
            // The companion auto-fix step, expandWildcardImports(), is NOT used: it needs a
            // JavaParser SymbolResolver wired to the compile classpath, Spotless provides no way to
            // configure one (diffplug/spotless#2846), and it fails with "Symbol resolution not
            // configured" on 33 files here. The 53 wildcards this repo had were expanded once,
            // mechanically, from measured usage; this check is what keeps them from coming back.
            forbidWildcardImports()

            // Escape hatch for the few places where manual alignment carries meaning -- e.g. the
            // column-aligned one-line accessors in MgfReader's Scan.
            toggleOffOn()
        }
    }
}

// The Makefile gets no formatter otherwise. Markdown is deliberately EXCLUDED: two trailing spaces is
// a semantic line break there, so reformatting docs would change how they render.
spotless {
    format 'makefile', {
        target 'Makefile'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    // Published alongside the main jar, with -javadoc and -sources classifiers. The javadoc jar is
    // where the SDK's class-level documentation lives -- docs/SDK.md deliberately documents no
    // classes, because prose duplicating javadoc drifts from it.
    withJavadocJar()
    withSourcesJar()
}

// ⛔ Vendored MSDK sources are excluded from JAVADOC but NOT from the sources jar, and the asymmetry
// is deliberate:
//
//   - javadoc documents OUR API. io/vendor/ is an implementation detail of the mzML/mzXML decoders,
//     not something a consumer calls. It also carries 5 upstream javadoc errors (bad HTML entity,
//     unresolvable @see references) that FAIL the javadoc task -- and they cannot be fixed here
//     without breaking the byte-identity docs/VENDORED.md asserts.
//   - the sources jar must match the binary we ship, which does contain those classes, and a
//     redistributor needs them to satisfy the EPL-1.0 election.
tasks.named('javadoc') {
    // Keep the doclint groups that catch BROKEN javadoc -- bad HTML, unresolvable @link/@see,
    // malformed syntax -- and drop `missing`, which demands an @param/@return on every member.
    // This codebase documents behaviour in prose rather than in tags (the reader sentinel contracts,
    // the zero-intensity note, the two m/z window semantics), so `missing` reports ~100 non-problems and would
    // bury a real one. Removing `-missing` is a tag-completeness project, not a correctness fix.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')

    exclude 'org/cytoscape/massql/io/vendor/**'
    // Same reasoning for the generated lexer/parser: machine-written, not our API, and the source of
    // ~100 "no comment" warnings that bury anything real.
    exclude '**/MassqlLexer.java', '**/MassqlParser.java', '**/MassqlVisitor.java',
            '**/MassqlBaseVisitor.java'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Free, no plugin. Not -Werror: that is only worth enabling once the warning count is
    // measured at zero, rather than assumed.
    options.compilerArgs << '-Xlint:all'
}

// Build outputs carry no version: build/libs/massql-java.jar, not massql-java-0.0.1-SNAPSHOT.jar.
//
// WHY. A version in the filename forces every consumer of that path to glob for it -- the Makefile
// ran `ls *.jar | sed`, and docs/CLI.md told readers to paste a version-stamped path that went stale
// on the next bump. A fixed name lets both state the path literally.
//
// This does NOT affect what is PUBLISHED. maven-publish names artifacts from
// artifactId/version/classifier, so the Nexus still receives massql-java-<version>.jar; only the
// local build output loses the stamp. release.yml copies the built jar to a versioned name before
// attaching it to a GitHub release, where a bare massql-java.jar would tell a downloader nothing.
tasks.withType(Jar).configureEach { archiveVersion = '' }

// ---------------------------------------------------------------------------------------------
// ErrorProne -- dead code fails the build
// ---------------------------------------------------------------------------------------------
//
// WHY. A migration audit found three methods with zero coverage that turned out to be genuinely
// unreachable: an AstBuilder.reject overload that no call site bound to, SpectrumTable's
// assertRowInRange, and RowMask.ofRange. Nothing in the build objected to any of them; they were
// found only because the coverage report happened to be read line by line.
//
// ⚠ WHAT THIS DOES AND DOES NOT CATCH. UnusedMethod flags PRIVATE members only -- deliberately, so
// it never has to reason about callers in other files. Of those three it would have caught exactly
// one (the private reject overload). No static analyser can flag an unused PUBLIC method in a
// library, because a library's callers are by definition outside the repo.
//
// The other half of the answer is the coverage gate: a method at 0% is either dead or untested, and
// both are worth acting on. That is what actually surfaced all three. The two tools cover different
// halves, so they are not redundant.
//
// Only the unused-code checks are enabled. This is not a general static-analysis adoption -- turning
// on ErrorProne's full catalogue would flood a mature codebase with findings unrelated to the reason
// it was added, which is how a check gets switched off wholesale.
allprojects {
    dependencies {
        // 2.39.0 is the NEWEST release still compiled for Java 17. From 2.40 onward ErrorProne
        // targets Java 21 (class file 65) and fails here with UnsupportedClassVersionError, because
        // this project targets JDK 17.
        // Do not bump this without raising the JDK target first.
        errorprone 'com.google.errorprone:error_prone_core:2.39.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            disableAllChecks = true
            error 'UnusedMethod', 'UnusedVariable', 'UnusedNestedClass'
            // ANTLR's generated parser is full of unused members by construction.
            excludedPaths = '.*/generated-src/.*'
        }
    }
}

dependencies {
    implementation "com.github.chhh:javolution-core-java-msftbx:6.11.8"
    implementation "org.antlr:antlr4-runtime:${antlrVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // The ANTLR *tool*, used only by generateGrammarSource. See the severing below.
    antlr "org.antlr:antlr4:${antlrVersion}"
}

// ---------------------------------------------------------------------------------------------
// ANTLR
// ---------------------------------------------------------------------------------------------

// Gradle's antlr plugin makes compile/runtime extendFrom `antlr`, which would put the whole ANTLR
// TOOL closure on the consumer classpath. generateGrammarSource takes its tool classpath from the
// `antlr` configuration directly, so severing the inheritance costs nothing.
configurations.configureEach { conf ->
    if (conf.name != 'antlr' && conf.extendsFrom.any { it.name == 'antlr' }) {
        conf.extendsFrom = conf.extendsFrom.findAll { it.name != 'antlr' }
    }
}

tasks.named('generateGrammarSource') {
    // Visitor yes, listener no -- the parser is consumed through a visitor. Gradle's plugin
    // generates listeners by default, which the Maven build explicitly disabled.
    //
    // -package is REQUIRED and is not optional the way Gradle's documentation implies. The plugin
    // mirrors src/main/antlr's directory structure into the output folder, but ANTLR itself emits
    // no `package` declaration unless told to, so the generated classes land in the correct
    // directory as members of the DEFAULT package -- and every reference to them fails to compile.
    // antlr4-maven-plugin derived this from the path automatically; Gradle's does not.
    arguments += ['-visitor', '-no-listener', '-package', 'org.cytoscape.massql.lang']
}

// ---------------------------------------------------------------------------------------------
// Tests: *IT is the integration tier, everything else is the unit tier
// ---------------------------------------------------------------------------------------------

// This block also supplies junit-jupiter and useJUnitPlatform() to the `test` task -- there is no
// explicit JUnit dependency anywhere else.
testing {
    suites {
        test {
            useJUnitJupiter(junitVersion)
        }
    }
}

tasks.named('test') {
    exclude '**/*IT.class', '**/*IT$*.class'
    systemProperty 'massql.tier', 'test'
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/*IT.class', '**/*IT$*.class'
    shouldRunAfter tasks.named('test')
    systemProperty 'massql.tier', 'integrationTest'

    // A test cannot detect its own non-execution: a broken filter runs zero tests and exits 0.
    def ran = new java.util.concurrent.atomic.AtomicInteger()
    afterTest { desc, result -> ran.incrementAndGet() }
    doLast {
        if (ran.get() == 0) {
            throw new GradleException(
                    "integrationTest matched no tests -- the *IT.class filter is broken")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// ---------------------------------------------------------------------------------------------
// Coverage gate
// ---------------------------------------------------------------------------------------------

// 90% instruction coverage, enforced by the build. A coverage floor rather than a test-count floor: a
// hand-maintained count rots on every test added, and cannot notice a test that stopped running.
//
// INSTRUCTION rather than BRANCH: measured branch coverage at this scope is ~83%, so a 90% branch
// rule would fail on arrival and mean something different from "90% coverage".
def coverageExclusions = [
    // Upstream MSDK, held byte-identical by policy -- not ours to test.
    'org/cytoscape/massql/io/vendor/**',
    // Machine-generated from Massql.g4. NOTE: MassqlParserFacade and its ThrowingErrorListener are
    // HAND-WRITTEN and must stay counted, so these are named exactly rather than globbed as
    // `Massql*`.
    'org/cytoscape/massql/lang/MassqlParser.class',
    'org/cytoscape/massql/lang/MassqlParser$*.class',
    'org/cytoscape/massql/lang/MassqlLexer.class',
    'org/cytoscape/massql/lang/MassqlBaseVisitor.class',
    'org/cytoscape/massql/lang/MassqlVisitor.class',
]

tasks.withType(JacocoReportBase).configureEach {
    // Both suites contribute. Binding the agent to the unit suite alone would silently exclude every
    // IT -- and in this project the gates ARE the ITs.
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.setFrom(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    classDirectories.setFrom(
        files(classDirectories.files.collect { fileTree(dir: it, excludes: coverageExclusions) })
    )
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// ---------------------------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------------------------

publishing {
    publications {
        sdk(MavenPublication) {
            from components.java
            artifactId = 'massql-java'
            pom {
                name = 'massql-java'
                description = 'Pure-Java MassQL SDK (scaninfo subset).'
                // Declared HERE and not only in the LICENSE file: a consumer resolving this
                // coordinate reads the POM, never the repository, so a licence stated only at the
                // repo root leaves the published artifact silent about its terms.
                licenses {
                    license {
                        name = 'Eclipse Public License - v 1.0'
                        url = 'https://www.eclipse.org/legal/epl-v10.html'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            // The NRNB-hosted Nexus this project publishes to.
            //
            // Credentials are looked up under the SAME repository id the URL below selects, so the
            // two can never disagree -- publishing a snapshot cannot pick up release credentials.
            //
            // ⚠ Gradle does NOT read ~/.m2/settings.xml; that is Maven's. Put the values in
            // ~/.gradle/gradle.properties (chmod 600) as `<id>User` / `<id>Pwd`, e.g.
            // cytoscape_snapshotsUser=... -- copied from the matching <server> in settings.xml.
            //
            // The environment fallback is what keeps CI working: release.yml has no
            // gradle.properties and supplies REPO_USER / REPO_PWD as GitHub secrets.
            name = 'nexus'
            def snapshot = version.toString().endsWith('SNAPSHOT')
            def repoId = snapshot ? 'cytoscape_snapshots' : 'cytoscape_releases'
            url = "https://nrnb-nexus.ucsd.edu/repository/${repoId}/"
            credentials {
                username = findProperty("${repoId}User") ?: System.getenv('REPO_USER')
                password = findProperty("${repoId}Pwd") ?: System.getenv('REPO_PWD')
            }
        }
    }
}
